# Google Cloud Run terminates HTTPS; the container receives HTTP on port 8080.
# Keep the Cloud Run container port set to 8080.
map $uri $atomos_cache_control {
    default "public, max-age=0, must-revalidate";
    /config.js "no-store, no-cache, must-revalidate";
    /sw.js "no-cache";
    /index.html "no-cache";
    / "no-cache";
}
server {
    listen 0.0.0.0:8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $atomos_cache_control always;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { return 404; }
}
